<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}</style>
<title>MonuTrack Entrada</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap">
<style>
/* Layout: RH = menu lateral + coluna de conteúdo (lista + detalhe em Pessoas); colaborador = coluna única, celular primeiro. */
:root{
  --bg:#F5F5F7; --surface:#FFFFFF; --fill:#E8E8ED; --fill-2:#F0F0F2; --side:rgba(255,255,255,.72);
  --ink:#1D1D1F; --ink-2:#6E6E73; --ink-3:#AEAEB2;
  --line:rgba(0,0,0,.08);
  --action:#1D1D1F; --on-action:#FFFFFF;
  --link:#0066CC;
  --brand:#C8F135; --on-brand:#1D1D1F;
  --ok:#1E7A35;   --ok-bg:#E8F5EC;
  --prog:#0058B0; --prog-bg:#E6F0FA;
  --wait:#515154; --wait-bg:#F0F0F2;
  --warn:#9A4500; --warn-bg:#FDF0E3;
  --crit:#C00013; --crit-bg:#FCE8EA;
  --scrim:rgba(29,29,31,.36); --shadow:0 10px 30px rgba(0,0,0,.08); --shadow-2:0 30px 80px rgba(0,0,0,.22);
  --hero:#1D1D1F; --on-hero:#F5F5F7; --on-hero-2:#A1A1A6;
  --r-field:10px; --r-card:20px; --r-pill:999px;
  --f:-apple-system,BlinkMacSystemFont,'SF Pro Text','Geist',system-ui,'Segoe UI',sans-serif;
  --m:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1C1C1E; --fill:#2C2C2E; --fill-2:#2C2C2E; --side:rgba(28,28,30,.72);
  --ink:#F5F5F7; --ink-2:#A1A1A6; --ink-3:#636366; --line:rgba(255,255,255,.1);
  --action:#F5F5F7; --on-action:#000000; --link:#2997FF;
  --ok:#30D158; --ok-bg:rgba(48,209,88,.16); --prog:#64A8FF; --prog-bg:rgba(100,168,255,.16);
  --wait:#A1A1A6; --wait-bg:#2C2C2E; --warn:#FF9F0A; --warn-bg:rgba(255,159,10,.16);
  --crit:#FF6961; --crit-bg:rgba(255,105,97,.16);
  --scrim:rgba(0,0,0,.6); --shadow:0 10px 30px rgba(0,0,0,.4); --shadow-2:0 30px 80px rgba(0,0,0,.6);
  --hero:#2C2C2E; --on-hero:#F5F5F7; --on-hero-2:#A1A1A6;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --fill:#2C2C2E; --fill-2:#2C2C2E; --side:rgba(28,28,30,.72);
  --ink:#F5F5F7; --ink-2:#A1A1A6; --ink-3:#636366; --line:rgba(255,255,255,.1);
  --action:#F5F5F7; --on-action:#000000; --link:#2997FF;
  --ok:#30D158; --ok-bg:rgba(48,209,88,.16); --prog:#64A8FF; --prog-bg:rgba(100,168,255,.16);
  --wait:#A1A1A6; --wait-bg:#2C2C2E; --warn:#FF9F0A; --warn-bg:rgba(255,159,10,.16);
  --crit:#FF6961; --crit-bg:rgba(255,105,97,.16);
  --scrim:rgba(0,0,0,.6); --shadow:0 10px 30px rgba(0,0,0,.4); --shadow-2:0 30px 80px rgba(0,0,0,.6);
  --hero:#2C2C2E; --on-hero:#F5F5F7; --on-hero-2:#A1A1A6;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--link);text-decoration:none}
svg{display:block;flex:none}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
:focus-visible{outline:3px solid var(--link);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--m);font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== tipografia: 6 tamanhos ===== */
.t-hero{font-size:48px;line-height:1.08;font-weight:700;letter-spacing:-.03em}
.t-title{font-size:34px;line-height:1.12;font-weight:700;letter-spacing:-.02em}
.t-sec{font-size:22px;line-height:1.25;font-weight:600;letter-spacing:-.015em}
.t-body{font-size:17px}
.t-sub{font-size:15px;color:var(--ink-2)}
.t-note{font-size:13px;color:var(--ink-2)}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.muted{color:var(--ink-2)} .soft{color:var(--ink-3)}
@media (max-width:640px){.t-hero{font-size:34px}.t-title{font-size:34px}}

/* ===== estrutura RH ===== */
.app{display:flex;min-height:100vh}
.side{flex:0 0 248px;position:sticky;top:0;height:100vh;overflow-y:auto;padding:24px 12px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.brand{display:flex;align-items:center;gap:10px;padding:0 12px 20px;font-size:17px;font-weight:600}
.logo{width:30px;height:30px;border-radius:8px;background:var(--ink);display:flex;align-items:center;justify-content:center}
.logo svg{color:var(--brand)}
.search{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;margin:0 4px 14px;border-radius:var(--r-field);background:var(--fill);color:var(--ink-2)}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:15px;color:var(--ink);outline:none}
.search kbd{font-family:var(--f);font-size:13px;color:var(--ink-2)}
.nav{display:flex;align-items:center;gap:12px;min-height:40px;padding:0 12px;border-radius:var(--r-field);color:var(--ink);font-size:15px;width:100%;text-align:left}
.nav:hover{background:var(--fill-2)}
.nav[aria-current="page"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
.nav .cnt{margin-left:auto;font-size:13px;color:var(--ink-2);font-weight:500}
.nav .cnt.hot{color:var(--crit);font-weight:600}
.today{width:22px;height:22px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.side .sp{flex:1}
.side .foot{padding:12px;font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.main{flex:1;min-width:0}
.wrap{max-width:960px;margin:0 auto;padding:48px 48px 120px}
.wrap.wide{max-width:none;padding:0}
@media (max-width:899px){
  .side{display:none}
  .wrap{padding:24px 16px 140px}
}

/* ===== barra inferior ===== */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--side);border-top:1px solid var(--line);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:13px;color:var(--ink-2);min-height:48px;position:relative}
.tabbar button[aria-current="page"]{color:var(--ink);font-weight:600}
.tabbar .dot{position:absolute;top:2px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--crit);color:#fff;font-size:13px;font-weight:600;line-height:18px}
@media (max-width:899px){.tabbar.rh{display:grid}}
.tabbar.col button span{white-space:nowrap}.tabbar.col{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-left:4px;padding-right:4px}

/* ===== superfícies ===== */
.card{background:var(--surface);border-radius:var(--r-card);padding:24px;min-width:0}
.card.pad-s{padding:16px 20px}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-l{display:flex;flex-direction:column;gap:48px}
.stack-m{display:flex;flex-direction:column;gap:24px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.row-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.between{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ===== botões ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:var(--r-pill);background:var(--action);color:var(--on-action);font-size:15px;font-weight:600;white-space:nowrap;transition:transform .12s,opacity .12s}
.btn:hover{opacity:.88}.btn:active{transform:scale(.98)}
.btn.lg{min-height:52px;padding:0 24px;font-size:17px}
.btn.block{width:100%}
.btn.sec{background:var(--fill);color:var(--ink);font-weight:500}
.btn.sm{min-height:36px;padding:0 14px;font-size:15px}
.btn[disabled]{opacity:.35;cursor:not-allowed;transform:none}
.lnk{color:var(--link);font-size:15px;font-weight:500;display:inline-flex;align-items:center;gap:4px;min-height:36px}
.lnk:hover{text-decoration:underline}
.icon-btn{width:44px;height:44px;border-radius:50%;background:var(--fill);display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.icon-btn.dark{background:var(--action);color:var(--on-action)}

/* ===== status ===== */
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border-radius:var(--r-pill);font-size:13px;font-weight:600;white-space:nowrap}
.k-ok{background:var(--ok-bg);color:var(--ok)}.k-prog{background:var(--prog-bg);color:var(--prog)}
.k-wait{background:var(--wait-bg);color:var(--wait)}.k-warn{background:var(--warn-bg);color:var(--warn)}
.k-crit{background:var(--crit-bg);color:var(--crit)}.k-lock{background:var(--fill-2);color:var(--ink-2)}
.c-ok{color:var(--ok)}.c-prog{color:var(--prog)}.c-wait{color:var(--ink-2)}.c-warn{color:var(--warn)}.c-crit{color:var(--crit)}.c-lock{color:var(--ink-2)}

/* ===== avatar ===== */
.av{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;background:var(--fill-2);color:var(--ink)}
.av.s{width:36px;height:36px;font-size:13px}
.av.l{width:72px;height:72px;font-size:22px}
.av.k-ok,.av.k-prog,.av.k-wait,.av.k-warn,.av.k-crit{padding:0}

/* ===== listas ===== */
.list{background:var(--surface);border-radius:var(--r-card);padding:4px 20px}
.list>*+*{border-top:1px solid var(--line)}
.prow{display:flex;align-items:center;gap:14px;padding:12px 0;width:100%;text-align:left;color:var(--ink);min-height:64px}
.prow:hover .pn{text-decoration:underline;text-decoration-color:var(--line)}
.prow .pm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.prow .pn{font-size:17px;font-weight:500}
.prow .ps{font-size:15px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis}
.prow .pw{font-size:15px;font-weight:500;white-space:nowrap}
.chev{color:var(--ink-3)}
.grp-h{display:flex;align-items:center;gap:12px;padding:16px 0 12px;flex-wrap:wrap}
.grp-h .gt{flex:1;font-size:17px;font-weight:600;min-width:180px}
.irow{display:flex;align-items:center;gap:14px;padding:14px 0;width:100%;text-align:left;color:var(--ink);flex-wrap:wrap}
.irow .it{flex:1 1 260px;min-width:0;font-size:17px}
.irow .iw{font-size:15px;color:var(--ink-2);white-space:nowrap}

/* ===== controle segmentado ===== */
.seg{display:flex;background:var(--fill);border-radius:var(--r-field);padding:3px;gap:2px}
.seg button{flex:1;min-height:36px;padding:0 10px;border-radius:8px;font-size:13px;color:var(--ink);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.14);font-weight:600}

/* ===== números ===== */
.stat{display:flex;flex-direction:column;gap:4px}
.stat b{font-size:48px;line-height:1.05;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat b.nil{color:var(--ink-3)}
.stat .sl{font-size:17px;font-weight:500}
.stat .sd{font-size:15px;color:var(--ink-2)}

/* ===== anel ===== */
.ring{position:relative;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring .rv b{font-size:34px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ring .rv span{font-size:13px;color:var(--ink-2);margin-top:2px}
.ring .trk{stroke:var(--fill)}

/* ===== formulário estilo iOS ===== */
.fgroup{background:var(--surface);border-radius:14px;padding:0 16px}
.fgroup>*+*{border-top:1px solid var(--line)}
.fld{display:flex;flex-direction:column;gap:2px;padding:10px 0}
.fld label{font-size:13px;color:var(--ink-2)}
.fld input,.fld select,.fld textarea{border:0;background:transparent;padding:0;min-height:30px;font-size:17px;color:var(--ink);outline:none;width:100%}
.fld textarea{min-height:72px;resize:vertical;padding-top:4px}
.fld input::placeholder,.fld textarea::placeholder{color:var(--ink-3)}
.fld .err{font-size:13px;color:var(--crit)}
.fld.bad label{color:var(--crit)}
.fld-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:6px 0}
.fld-row label{font-size:17px}
.fld-row select,.fld-row input{border:0;background:transparent;text-align:right;color:var(--link);font-size:17px;outline:none;min-width:0;max-width:60%}
.fld-row input{color:var(--ink)}
.fhelp{font-size:13px;color:var(--ink-2);padding:6px 16px 0}
.fsplit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:16px}
.fsplit>.fld:nth-child(n+3){border-top:1px solid var(--line)}
.fsplit>.fld:nth-child(2){border-top:0}
.fgroup>.fsplit{border-top:1px solid var(--line)}
.check{display:flex;align-items:flex-start;gap:12px;padding:14px 0;font-size:15px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--action);flex:none;margin:0}

/* ===== folha (sheet) ===== */
.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:24px 16px}
.sheet{width:min(560px,100%);max-height:calc(100vh - 48px);overflow:auto;background:var(--bg);border-radius:24px;box-shadow:var(--shadow-2);display:flex;flex-direction:column}
.sheet.wide{width:min(920px,100%)}
.sheet-h{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:14px 20px;background:var(--bg);border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:17px;font-weight:600;text-align:center}
.sheet-h .l{justify-self:start}.sheet-h .r{justify-self:end;font-size:15px;color:var(--ink-2)}
.sheet-b{padding:20px}
.sheet-f{padding:0 20px 20px;display:flex;gap:12px;flex-wrap:wrap}
@media (max-width:640px){.scrim{align-items:flex-end;padding:0}.sheet{border-radius:24px 24px 0 0;max-height:92vh}}

/* ===== confirmação ===== */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:80;display:flex;align-items:center;gap:8px;max-width:min(560px,calc(100vw - 32px));padding:12px 18px;border-radius:var(--r-pill);background:var(--action);color:var(--on-action);font-size:15px;font-weight:500;box-shadow:var(--shadow-2);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.has-tabbar .toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
@media (max-width:899px){.is-rh .toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}}

/* ===== jornada (RH) ===== */
.jrn{background:var(--surface);border-radius:var(--r-card);padding:4px 20px}
.jrn>*+*{border-top:1px solid var(--line)}
.jstep>button{display:flex;align-items:center;gap:14px;width:100%;padding:12px 0;text-align:left;min-height:56px}
.jdot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.jstep .jt{flex:1;min-width:0;font-size:17px}
.jstep .jw{font-size:15px;color:var(--ink-2);white-space:nowrap}
.jstep.now .jt{font-weight:600}
.jstep.lock .jt{color:var(--ink-2)}
.jbody{padding:0 0 16px 44px;display:flex;flex-direction:column;gap:12px}
.mini{display:flex;align-items:center;gap:12px;padding:10px 0;flex-wrap:wrap;border-top:1px solid var(--line)}
.mini:first-child{border-top:0}
.mini .mt{flex:1 1 200px;min-width:0;font-size:15px}
.mini .mt small{display:block;font-size:13px;color:var(--ink-2)}
.tick{display:flex;align-items:center;gap:12px;padding:10px 0;width:100%;text-align:left;font-size:15px;border-top:1px solid var(--line)}
.tick:first-child{border-top:0}
.box{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--ink-3);display:flex;align-items:center;justify-content:center;flex:none;color:var(--on-action)}
.tick.on .box{background:var(--ok);border-color:var(--ok);color:#fff}
.tick.on span{color:var(--ink-2)}

/* ===== Pessoas (lista + detalhe) ===== */
.split{display:flex;min-height:100vh}
.split .lst{flex:0 0 380px;border-right:1px solid var(--line);padding:32px 16px 120px;display:flex;flex-direction:column;gap:14px;min-width:0}
.split .dtl{flex:1;min-width:0;padding:40px 48px 120px}
.split .dtl .inner{max-width:760px}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;width:100%;text-align:left;color:var(--ink)}
.lrow:hover{background:var(--fill-2)}
.lrow[aria-current="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.lrow .lm{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.lrow .l1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.lrow .ln{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .lw{font-size:13px;font-weight:500;white-space:nowrap}
.lrow .ls{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--link);font-size:17px;min-height:44px;margin:-8px 0 8px}
@media (max-width:1099px){
  .split{display:block}
  .split .lst{border-right:0;padding:24px 16px 140px}
  .split .dtl{padding:24px 16px 140px}
  .split.show-d .lst{display:none}
  .split:not(.show-d) .dtl{display:none}
}
@media (min-width:1100px){.back{display:none}}

/* ===== próximo passo ===== */
.next{background:var(--surface);border-radius:var(--r-card);padding:24px;display:flex;flex-direction:column;gap:16px}
.next .acts{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* ===== colaborador ===== */
.col-wrap{max-width:520px;margin:0 auto;padding:32px 20px 140px;display:flex;flex-direction:column;gap:28px}
@media (min-width:900px){.col-wrap{max-width:720px;padding-top:48px}}
.col-top{display:none}
@media (min-width:900px){
  .tabbar.col{display:none}
  .col-top{display:flex;justify-content:center;padding:16px 16px 0}
  .col-top .seg{width:min(560px,100%)}
}
.now-card{background:var(--surface);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.hero-day{background:var(--hero);color:var(--on-hero);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px}
.hero-day .hd{display:flex;align-items:baseline;gap:10px}
.hero-day .hd b{font-size:34px;font-weight:700;letter-spacing:-.02em;color:var(--brand)}
.hero-day .muted{color:var(--on-hero-2)}
.hero-day .ag{display:grid;grid-template-columns:56px 1fr;gap:6px 12px;font-size:15px}

/* ---------- tempo e texto ---------- */
const DAY=86400000;
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const SEM=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const dt=d=>new Date(S.clock.getTime()+d*DAY);
const fmt=d=>d?d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'}):'—';
const fmtc=d=>d?d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}):'—';
const fmtL=d=>d?(d.getDate()===1?'1º':d.getDate())+' de '+MES[d.getMonth()]:'—';
const fmtW=d=>d?SEM[d.getDay()].replace('-feira','')+', '+fmtL(d):'—';
const dias=d=>d?Math.round((d.getTime()-S.clock.getTime())/DAY):null;   /* futuro positivo */
const desde=d=>d?Math.round((S.clock.getTime()-d.getTime())/DAY):null;  /* passado positivo */

const POL_TXT={"p1": [{"h": "1. Objetivo", "b": [{"p": "Estabelecer os princípios de conduta, direitos e deveres esperados de todos os colaboradores da Monumenta, promovendo um ambiente de trabalho ético, respeitoso, seguro e produtivo, em conformidade com a Consolidação das Leis do Trabalho (CLT) e demais legislações aplicáveis."}]}, {"h": "2. Abrangência", "b": [{"p": "Esta política se aplica a todos os colaboradores da Monumenta, independentemente do vínculo (CLT, PJ, estagiários, aprendizes, temporários) e da equipe ou projeto ao qual estejam alocados."}]}, {"h": "3. Princípios de Conduta", "b": [{"p": "3.1. Todos os colaboradores devem pautar sua conduta profissional pelo respeito mútuo, honestidade, urbanidade e cooperação, tanto nas relações internas quanto no relacionamento com clientes, fornecedores e o público em geral."}, {"p": "3.2. É dever de todo colaborador zelar pela imagem e reputação da Monumenta e de seus clientes, evitando manifestações públicas (inclusive em redes sociais pessoais) que possam associar a empresa a conteúdo ofensivo, discriminatório ou prejudicial à sua imagem."}, {"p": "3.3. Não serão toleradas condutas de assédio moral ou sexual, discriminação de qualquer natureza (raça, cor, gênero, orientação sexual, religião, origem, deficiência, idade ou condição social), violência ou qualquer forma de tratamento desrespeitoso entre colaboradores, líderes, clientes ou fornecedores."}, {"p": "3.4. Qualquer colaborador que presencie, sofra ou tenha conhecimento de situações de assédio ou discriminação deve reportar o fato ao RH, que garantirá o tratamento confidencial e a apuração adequada do caso, vedada qualquer forma de retaliação a quem reportar de boa-fé."}]}, {"h": "4. Jornada de Trabalho e Frequência", "b": [{"p": "4.1. A jornada de trabalho, os horários de entrada e saída e os intervalos observam o que estiver definido em contrato individual, no regimento interno e na legislação trabalhista vigente."}, {"p": "4.2. O controle de ponto/frequência, quando aplicável, deve ser registrado fielmente pelo colaborador, sendo vedada qualquer forma de fraude no registro (registro por terceiros, marcações incorretas)."}, {"p": "4.3. Ausências, atrasos e saídas antecipadas devem ser previamente comunicados e, sempre que possível, autorizados pelo gestor imediato."}]}, {"h": "5. Trabalho Remoto e Modelo Híbrido", "b": [{"p": "5.1. Quando adotado o modelo remoto ou híbrido, o colaborador deve manter disponibilidade, produtividade e comunicação equivalentes às exigidas no trabalho presencial, respeitando os horários e reuniões definidos pela equipe."}, {"p": "5.2. O colaborador em trabalho remoto é responsável por garantir um ambiente adequado, com conexão à internet estável e segurança das informações acessadas, conforme a Política de Segurança da Informação e TI."}]}, {"h": "6. Uso de Uniformes, Crachás e Apresentação Pessoal", "b": [{"p": "6.1. Em atividades presenciais, especialmente em eventos e ativações para clientes, os colaboradores devem seguir as orientações de uniforme, crachá de identificação e apresentação pessoal definidas para cada projeto/cliente."}, {"p": "6.2. No ambiente de escritório, a apresentação pessoal deve ser compatível com um ambiente profissional, respeitando eventuais diretrizes específicas de cada cliente atendido no dia."}]}, {"h": "7. Relacionamento com Clientes e Fornecedores", "b": [{"p": "7.1. Todo colaborador deve representar a Monumenta com profissionalismo perante clientes e fornecedores, evitando promessas não autorizadas, compartilhamento de informações confidenciais ou qualquer conduta que comprometa a relação comercial."}, {"p": "7.2. É vedado o recebimento de presentes, comissões ou vantagens de fornecedores e clientes que possam configurar conflito de interesses, salvo brindes institucionais de valor simbólico, conforme orientação do RH/Diretoria."}]}, {"h": "8. Conflito de Interesses", "b": [{"p": "8.1. Considera-se conflito de interesses qualquer situação em que interesses pessoais do colaborador (financeiros, familiares, societários) possam influenciar ou parecer influenciar decisões profissionais."}, {"p": "8.2. O colaborador deve comunicar ao seu gestor e ao RH qualquer situação de potencial conflito de interesses, incluindo vínculos familiares ou societários com fornecedores, clientes ou concorrentes."}]}, {"h": "9. Uso de Benefícios e Recursos da Empresa", "b": [{"p": "9.1. Benefícios corporativos (vale-alimentação, transporte, plataformas de bem-estar como Zenklub e Wellhub, entre outros) devem ser utilizados de acordo com as regras específicas de cada benefício, sendo vedado o uso indevido ou o repasse a terceiros."}, {"p": "9.2. Equipamentos, materiais e instalações da empresa devem ser utilizados com zelo e exclusivamente para fins profissionais, conforme também disposto na Política de Segurança da Informação e TI e na Política Financeira e de Despesas."}]}, {"h": "10. Processo Disciplinar", "b": [{"p": "10.1. O descumprimento desta política poderá resultar, conforme a gravidade, reincidência e circunstâncias do caso, em orientação verbal, advertência escrita, suspensão disciplinar ou rescisão do contrato de trabalho, inclusive por justa causa nos casos previstos em lei."}, {"p": "10.2. Antes da aplicação de medida disciplinar, será assegurado ao colaborador, sempre que cabível, o direito de apresentar sua versão dos fatos."}]}, {"h": "11. Canal de Denúncias", "b": [{"p": "11.1. A Monumenta disponibiliza canal(is) de comunicação com o RH para relato de irregularidades, condutas antiéticas, assédio ou discriminação, garantindo a devida apuração e a confidencialidade do relato, na medida do possível e observados os limites legais."}, {"p": "11.2. Denúncias feitas de má-fé, com o objetivo de prejudicar terceiros, também estão sujeitas a apuração e medidas disciplinares."}]}, {"h": "12. Disposições Finais", "b": [{"p": "Esta política será revisada periodicamente pelo RH e pela Diretoria, podendo ser complementada por normas específicas de cada projeto/cliente, prevalecendo sempre a regra mais protetiva ao colaborador quando houver conflito com a legislação trabalhista vigente. Casos omissos serão decididos pelo RH em conjunto com a Diretoria."}]}], "p2": [{"h": "1. Objetivo", "b": [{"p": "Estabelecer diretrizes e procedimentos para a realização, comprovação, aprovação e reembolso de despesas, bem como para a gestão de compras, pagamentos a fornecedores e uso de cartão corporativo, garantindo controle financeiro, transparência e conformidade fiscal na Monumenta."}]}, {"h": "2. Abrangência", "b": [{"p": "Aplica-se a todos os colaboradores da Monumenta (CLT e PJ) que incorram em despesas em nome da empresa ou de projetos/clientes, ou que participem de processos de compra, contratação de fornecedores ou aprovação financeira."}]}, {"h": "3. Princípios Gerais", "b": [{"p": "Toda despesa realizada em nome da Monumenta deve ser necessária, razoável, devidamente comprovada e vinculada a uma atividade profissional ou a um projeto/cliente específico. Despesas de caráter pessoal não são reembolsáveis, salvo exceções expressamente previstas nesta política."}]}, {"h": "4. Alçadas de Aprovação", "b": [{"p": "4.1. Toda despesa ou compra deve ser previamente aprovada pelo gestor imediato, respeitando os seguintes limites de alçada (valores de referência, sujeitos a atualização pela Diretoria):"}, {"l": "Até R$ 500,00: aprovação do gestor direto."}, {"l": "De R$ 500,01 a R$ 5.000,00: aprovação do gestor direto e do coordenador/gerente da área."}, {"l": "Acima de R$ 5.000,00: aprovação da Diretoria."}, {"p": "4.2. Despesas vinculadas a projetos de clientes específicos (ex.: BB Promo, Petrobras, Sebrae, FUNCEF, APEX, Transpetro) devem ainda observar os limites e regras de reembolso previstos em cada contrato, quando existentes, prevalecendo a regra mais restritiva."}, {"p": "4.3. Compras e contratações sem aprovação prévia, salvo emergências devidamente justificadas a posteriori, não serão reembolsadas."}]}, {"h": "5. Reembolso de Despesas", "b": [{"p": "5.1. São passíveis de reembolso, mediante comprovação e aprovação prévia, despesas como: transporte a serviço (aplicativos, táxi, pedágio, estacionamento), alimentação em viagem ou reunião externa a trabalho, hospedagem, material necessário à execução de eventos/projetos, e outras despesas expressamente autorizadas pelo gestor."}, {"p": "5.2. Toda solicitação de reembolso deve ser acompanhada de nota fiscal ou recibo válido, com data, valor e descrição compatíveis com a despesa relatada, além da identificação do projeto/centro de custo correspondente."}, {"p": "5.3. As solicitações de reembolso devem ser enviadas em até 30 (trinta) dias corridos a partir da data da despesa, por meio do formulário/canal definido pelo Financeiro. Solicitações fora desse prazo poderão ser recusadas."}, {"p": "5.4. Despesas sem comprovante fiscal, incompatíveis com a atividade relatada, ou de natureza pessoal (ex.: bebidas alcoólicas, itens de uso pessoal, multas de trânsito) não serão reembolsadas."}, {"p": "5.5. O reembolso será processado em até 2 (dois) ciclos de pagamento após a aprovação da solicitação, salvo comunicação em contrário do Financeiro."}]}, {"h": "6. Viagens a Trabalho", "b": [{"p": "6.1. Toda viagem a trabalho deve ser previamente aprovada pelo gestor, com antecedência mínima de 5 (cinco) dias úteis, exceto em casos de urgência operacional."}, {"p": "6.2. Passagens e hospedagens devem, sempre que possível, ser reservadas pelos canais/agência definidos pela empresa, buscando o melhor custo-benefício."}, {"p": "6.3. Despesas de alimentação em viagem devem observar os limites diários de valor definidos pelo Financeiro/RH, podendo variar conforme a cidade de destino e o cliente/projeto atendido."}]}, {"h": "7. Cartão Corporativo", "b": [{"p": "7.1. O cartão corporativo, quando fornecido, é de uso exclusivo para despesas profissionais autorizadas e não deve ser utilizado para despesas pessoais em nenhuma hipótese."}, {"p": "7.2. Todo lançamento no cartão corporativo deve ser acompanhado de comprovante fiscal e da respectiva prestação de contas mensal, dentro do prazo definido pelo Financeiro."}, {"p": "7.3. Em caso de perda, furto ou uso indevido do cartão corporativo, o fato deve ser comunicado imediatamente ao Financeiro e à operadora do cartão para bloqueio."}]}, {"h": "8. Benefícios com Impacto Financeiro (Verba de Alimentação, Uber Corporativo e similares)", "b": [{"p": "8.1. Benefícios como verba de alimentação e transporte corporativo (Uber) devem ser utilizados estritamente dentro das regras, limites de valor e finalidades definidas para cada benefício, sendo vedado o uso para fins pessoais ou de terceiros."}, {"p": "8.2. O uso indevido de benefícios corporativos está sujeito a estorno do valor e às medidas disciplinares previstas na Política de RH e Conduta."}]}, {"h": "9. Compras e Contratação de Fornecedores", "b": [{"p": "9.1. A contratação de fornecedores deve, sempre que possível, envolver cotação prévia com no mínimo 2 (dois) fornecedores, especialmente para valores acima do limite definido pela Diretoria."}, {"p": "9.2. Deve ser evitado conflito de interesses na escolha de fornecedores; qualquer relação pessoal ou societária entre o colaborador responsável pela contratação e o fornecedor deve ser previamente informada ao gestor e ao Financeiro."}, {"p": "9.3. Pagamentos a fornecedores somente serão realizados mediante nota fiscal/contrato válido e aprovação conforme as alçadas definidas nesta política."}]}, {"h": "10. Consequências do Descumprimento", "b": [{"p": "O uso indevido de recursos financeiros, benefícios ou do cartão corporativo, a apresentação de comprovantes falsos ou a solicitação de reembolso de despesas não elegíveis constituem falta grave, sujeita a advertência, suspensão ou rescisão do contrato por justa causa, sem prejuízo de eventual responsabilização civil ou criminal."}]}, {"h": "11. Disposições Finais", "b": [{"p": "Os valores de alçada e limites mencionados nesta política serão revisados periodicamente pela Diretoria e pelo Financeiro, podendo ser atualizados por comunicado interno sem necessidade de reemissão integral do documento. Casos omissos serão decididos pelo Financeiro em conjunto com a Diretoria."}]}], "p3": [{"h": "1. Objetivo", "b": [{"p": "Esta política estabelece as diretrizes, responsabilidades e regras de uso relacionadas à segurança da informação e aos recursos de tecnologia da informação (TI) da Monumenta, com o objetivo de proteger os ativos de informação da empresa e de seus clientes, garantir a continuidade das operações e assegurar a conformidade com a Lei Geral de Proteção de Dados (Lei nº 13.709/2018 — LGPD) e demais normas aplicáveis."}]}, {"h": "2. Abrangência", "b": [{"p": "Esta política se aplica a todos os colaboradores da Monumenta, sejam eles empregados CLT, prestadores de serviço (PJ), estagiários, aprendizes ou terceiros que tenham acesso, ainda que temporário, aos sistemas, equipamentos, redes ou informações da empresa, independentemente do vínculo contratual ou do projeto/cliente ao qual estejam alocados (incluindo operações dedicadas como BB Promo, Petrobras, Sebrae, FUNCEF, APEX e Transpetro)."}]}, {"h": "3. Princípios Gerais", "b": [{"p": "A informação é um ativo estratégico da Monumenta e deve ser protegida contra acessos não autorizados, uso indevido, perda, vazamento ou destruição, respeitando os princípios de confidencialidade, integridade e disponibilidade."}]}, {"h": "4. Classificação da Informação", "b": [{"p": "As informações da empresa devem ser tratadas de acordo com o seu grau de sensibilidade:"}, {"l": "Pública: informação que pode ser divulgada livremente, sem risco à empresa (materiais institucionais, campanhas já publicadas)."}, {"l": "Interna: informação de uso restrito aos colaboradores, sem risco relevante se exposta, mas que não deve ser divulgada externamente (comunicados internos, procedimentos operacionais)."}, {"l": "Confidencial: informação sensível cujo acesso é restrito a pessoas autorizadas (dados de clientes, contratos, propostas comerciais, dados financeiros, informações de projetos de clientes como Banco do Brasil, Petrobras, Sebrae, FUNCEF, APEX e Transpetro)."}, {"l": "Restrita/Pessoal: dados pessoais e dados pessoais sensíveis de colaboradores, clientes, fornecedores e participantes de eventos, sujeitos à LGPD (CPF, dados bancários, dados de saúde, biometria, entre outros)."}]}, {"h": "5. Uso de Equipamentos e Recursos de TI", "b": [{"p": "5.1. Os equipamentos (notebooks, desktops, celulares corporativos, tokens de acesso) fornecidos pela Monumenta são de uso profissional e devem ser utilizados prioritariamente para atividades relacionadas ao trabalho."}, {"p": "5.2. É vedado instalar softwares não homologados pela área de TI, desabilitar antivírus/firewall corporativo, ou realizar alterações não autorizadas nas configurações de segurança dos equipamentos."}, {"p": "5.3. Equipamentos e mídias removíveis (pen drives, HDs externos) devem ser protegidos contra perda e furto; qualquer extravio deve ser comunicado imediatamente à área de TI."}, {"p": "5.4. Ao término do contrato ou desligamento, todos os equipamentos, acessos e materiais fornecidos pela empresa devem ser devolvidos, e os acessos aos sistemas serão revogados no último dia de vigência do contrato."}]}, {"h": "6. Senhas e Controle de Acesso", "b": [{"p": "6.1. O acesso a sistemas, e-mails e redes corporativas é individual e intransferível; é proibido compartilhar senhas, mesmo entre colegas de equipe."}, {"p": "6.2. As senhas devem seguir os critérios mínimos de complexidade definidos pela área de TI e devem ser trocadas periodicamente ou sempre que houver suspeita de comprometimento."}, {"p": "6.3. Sempre que disponível, deve ser utilizada autenticação em dois fatores (2FA), especialmente em sistemas que armazenam dados de clientes ou dados financeiros."}, {"p": "6.4. O acesso a sistemas e pastas deve seguir o princípio do menor privilégio: cada colaborador deve ter acesso apenas às informações necessárias para o exercício de sua função."}]}, {"h": "7. Uso de E-mail, Internet e Redes Sociais Corporativas", "b": [{"p": "7.1. O e-mail corporativo deve ser utilizado para fins profissionais, sendo vedado seu uso para cadastro em serviços pessoais, correntes, spam ou conteúdo ofensivo."}, {"p": "7.2. Colaboradores devem adotar cautela redobrada com e-mails de remetentes desconhecidos, links suspeitos e anexos não solicitados (phishing), reportando imediatamente à TI qualquer suspeita."}, {"p": "7.3. O uso de redes sociais em nome da Monumenta ou de seus clientes deve seguir estritamente as diretrizes de comunicação e aprovação previamente definidas com cada cliente/projeto."}]}, {"h": "8. Proteção de Dados Pessoais (LGPD)", "b": [{"p": "8.1. Todo colaborador que, no exercício de suas funções, tenha acesso a dados pessoais de clientes, fornecedores, colaboradores ou participantes de eventos (bases de convidados, formulários de credenciamento, listas de contato) deve tratá-los com confidencialidade e apenas para as finalidades previstas em contrato ou nas atividades do projeto."}, {"p": "8.2. É proibido copiar, extrair ou compartilhar bases de dados pessoais para uso fora do escopo autorizado, inclusive após o término do projeto ou do contrato de trabalho."}, {"p": "8.3. Qualquer incidente envolvendo vazamento, perda ou acesso indevido a dados pessoais deve ser comunicado imediatamente à área de TI/Compliance, para que os prazos legais de notificação previstos na LGPD sejam observados."}, {"p": "8.4. Dúvidas sobre o tratamento de dados pessoais em projetos específicos devem ser direcionadas à área responsável antes da execução da atividade."}]}, {"h": "9. Trabalho Remoto e Dispositivos Pessoais (BYOD)", "b": [{"p": "9.1. Quando autorizado o acesso a sistemas corporativos por meio de dispositivos pessoais, o colaborador deve manter o dispositivo atualizado e protegido por senha, e comunicar imediatamente qualquer perda ou furto do aparelho."}, {"p": "9.2. Em ambientes públicos ou compartilhados, deve-se evitar o acesso a informações confidenciais em telas visíveis a terceiros e o uso de redes Wi-Fi públicas não seguras sem VPN."}]}, {"h": "10. Incidentes de Segurança", "b": [{"p": "10.1. Considera-se incidente de segurança qualquer evento que comprometa a confidencialidade, integridade ou disponibilidade da informação (perda de equipamento, vazamento de dados, acesso indevido, infecção por vírus/ransomware, phishing bem-sucedido)."}, {"p": "10.2. Todo colaborador tem o dever de reportar incidentes, suspeitas ou vulnerabilidades à área de TI imediatamente após a identificação, sem receio de retaliação por reportar de boa-fé."}]}, {"h": "11. Consequências do Descumprimento", "b": [{"p": "O descumprimento desta política poderá acarretar, conforme a gravidade e reincidência, advertência verbal ou escrita, suspensão, rescisão do contrato de trabalho ou de prestação de serviços, sem prejuízo de eventuais medidas cíveis ou criminais cabíveis, especialmente em casos de vazamento de dados de clientes ou uso indevido de informações confidenciais."}]}, {"h": "12. Disposições Finais", "b": [{"p": "Esta política deve ser revisada periodicamente pela área de TI, em conjunto com a Diretoria, para acompanhar mudanças legais, tecnológicas e operacionais. Casos omissos serão avaliados pela área de TI em conjunto com a Diretoria e/ou RH."}]}], "p4": [{"h": "1. Objetivo", "b": [{"p": "Esta Política estabelece as diretrizes e responsabilidades para uso de todos os equipamentos de trabalho da Monumenta Comunicação, abrangendo notebooks, desktops, Mac Minis, monitores, periféricos e acessórios, sejam eles de propriedade da empresa (corporativos), de uso compartilhado ou de propriedade do colaborador utilizados para fins profissionais (BYOD – Bring Your Own Device)."}, {"p": "O objetivo é garantir a segurança das informações, a integridade dos equipamentos, o bom uso dos recursos tecnológicos e a conformidade com as normas internas e a legislação vigente. Os equipamentos são identificados e rastreados pelo seu número de série (S/N), que serve como referência única para controle, manutenção e responsabilidade."}]}, {"h": "2. Abrangência", "b": [{"p": "Esta política se aplica a todos os colaboradores, estagiários, prestadores de serviço e parceiros que utilizem equipamentos vinculados às atividades da Monumenta Comunicação, independentemente da modalidade de contratação ou da localização de trabalho (presencial, híbrida ou remota)."}]}, {"h": "3. Definições", "b": [{"s": "3.1 Tipos de Equipamentos Abrangidos"}, {"p": "Esta política cobre todos os equipamentos de trabalho, incluindo, mas não se limitando a:"}, {"l": "Computadores portáteis: notebooks e laptops de qualquer marca (Dell, Apple MacBook, Asus, Lenovo, etc.)."}, {"l": "Computadores fixos: desktops, Mac Minis e estações de trabalho."}, {"l": "Monitores: telas externas fornecidas pela empresa ou utilizadas em conjunto com equipamento corporativo."}, {"l": "Periféricos de entrada: teclados, mouses, trackpads e mesas digitalizadoras."}, {"l": "Dispositivos de áudio/vídeo: headsets, fones de ouvido, webcams e microfones."}, {"l": "Acessórios de conectividade: hubs USB, docks, adaptadores, cabos e roteadores fornecidos pela empresa."}, {"l": "Carregadores e fontes de alimentação: carregadores originais ou homologados entregues junto com o equipamento principal."}, {"l": "Dispositivos de armazenamento externo: HDs externos e pendrives fornecidos pela empresa para uso profissional."}, {"l": "Smartphones e tablets corporativos: quando fornecidos pela empresa para uso nas atividades profissionais."}, {"s": "3.2 Categorias de Posse"}, {"l": "Equipamento Corporativo: bem de propriedade da Monumenta, identificado pelo número de série (S/N) do fabricante, entregue ao colaborador para uso exclusivo nas atividades profissionais."}, {"l": "Equipamento Compartilhado: bem de propriedade da empresa destinado ao uso por mais de um colaborador, conforme escala ou necessidade da área, igualmente identificado pelo número de série."}, {"l": "Equipamento Pessoal (BYOD): dispositivo de propriedade do colaborador utilizado para execução de atividades profissionais, sujeito às regras de segurança desta política."}, {"s": "3.3 Identificação dos Equipamentos"}, {"p": "Todo equipamento corporativo ou compartilhado é identificado unicamente pelo seu número de série (S/N) gravado pelo fabricante no próprio dispositivo. O número de série é o campo de referência em todos os registros, termos, chamados de suporte e comunicações com o TI. Em caso de ausência de número de série visível, o TI atribuirá uma etiqueta de identificação interna."}, {"l": "Termo de Responsabilidade: documento assinado pelo colaborador ao receber qualquer equipamento corporativo ou compartilhado, contendo o número de série do equipamento e assumindo responsabilidade pela guarda e uso correto do bem."}]}, {"h": "4. Responsabilidades do Colaborador", "b": [{"s": "4.1 Guarda e Conservação"}, {"l": "Zelar por todos os equipamentos recebidos com o mesmo cuidado que dedicaria a um bem próprio, evitando danos físicos, exposição a líquidos, quedas e desgaste acelerado."}, {"l": "Manter os acessórios (carregador, cabo, mouse, etc.) organizados e guardá-los junto com o equipamento principal ao final do uso."}, {"l": "Não emprestá-los a terceiros, familiares ou outros colaboradores sem autorização prévia e formal do setor de TI."}, {"l": "Comunicar ao TI imediatamente em caso de perda, furto, roubo, dano ou mau funcionamento de qualquer equipamento ou acessório."}, {"l": "Devolver todos os equipamentos e acessórios em perfeitas condições ao fim do vínculo empregatício ou mediante solicitação da empresa."}, {"s": "4.2 Segurança da Informação"}, {"l": "Manter o antivírus instalado e atualizado conforme orientação do setor de TI."}, {"l": "Manter o sistema operacional e os aplicativos sempre atualizados."}, {"l": "Usar senhas fortes e não compartilhá-las com outros colaboradores."}, {"l": "Não instalar softwares não autorizados, aplicativos piratas ou de origem duvidosa."}, {"l": "Não desabilitar ferramentas de segurança (firewall, antivírus, MDM)."}, {"l": "Realizar o bloqueio automático de tela sempre que se ausentar do computador."}, {"l": "Ingressar no domínio corporativo da Monumenta quando solicitado pelo TI."}, {"l": "Não conectar dispositivos de armazenamento externos de origem desconhecida aos equipamentos da empresa."}, {"s": "4.3 Uso Aceitável"}, {"l": "Utilizar os equipamentos prioritariamente para fins profissionais ligados às atividades da Monumenta."}, {"l": "Uso pessoal eventual é tolerado, desde que não comprometa a produtividade, a segurança ou os recursos da empresa."}, {"l": "É vedado o uso dos equipamentos para: acesso a conteúdo ilegal ou imoral; atividades que configurem assédio ou discriminação; armazenamento ou distribuição de material protegido por direitos autorais sem licença; realização de atividades remuneradas para terceiros sem autorização."}, {"s": "4.4 Trabalho Remoto"}, {"l": "O colaborador em regime remoto ou híbrido é inteiramente responsável pela segurança física dos equipamentos em seu domicílio ou local de trabalho alternativo."}, {"l": "Deve garantir que os equipamentos estejam conectados a redes seguras (WPA2/WPA3) e evitar redes públicas sem uso de VPN."}, {"l": "Em caso de danos ocorridos fora das dependências da empresa, o colaborador deverá comunicar o TI e o RH no prazo de 24 horas."}]}, {"h": "5. Uso de Equipamentos Pessoais (BYOD)", "b": [{"p": "Colaboradores que utilizam equipamento próprio para trabalho concordam, ao assinar este documento, que:"}, {"l": "O equipamento poderá ser inspecionado pelo TI, de forma remota e não invasiva, para verificar conformidade com as políticas de segurança."}, {"l": "Concordam com a instalação e manutenção do agente de antivírus BitDefender, disponibilizado pelo setor de TI da Monumenta. A ausência deste agente poderá impedir o acesso aos sistemas e redes da empresa."}, {"l": "Concordam com a instalação do agente do sistema de chamados e inventário Milvus, utilizado pela Monumenta para gestão de ativos e suporte técnico remoto."}, {"l": "O dispositivo utilizado deverá operar com sistema operacional Windows 11 ou macOS em versão atual suportada pelo fabricante. Versões anteriores ou não homologadas não serão aceitas para acesso aos recursos tecnológicos da Monumenta."}, {"l": "Devem manter o sistema operacional (Windows 11 ou macOS) e seus aplicativos sempre atualizados, aplicando prontamente as atualizações de segurança disponibilizadas pelo fabricante."}, {"l": "É expressamente proibida a instalação de softwares piratas, sem licença válida ou de origem duvidosa no dispositivo, especialmente quando em uso nas dependências físicas da empresa."}, {"l": "Devem comunicar imediatamente ao setor de TI ou RH qualquer incidente de segurança ou suspeita de comprometimento do dispositivo, incluindo infecção por malware, acesso não autorizado ou perda/furto do equipamento."}, {"l": "Devem separar dados pessoais de dados profissionais, utilizando preferencialmente ambientes distintos (perfis, contas ou máquinas virtuais)."}, {"l": "A empresa não se responsabiliza por danos, perda de dados pessoais ou desgaste do equipamento decorrentes do uso profissional."}]}, {"h": "6. Obrigações da Monumenta Comunicação", "b": [{"l": "Fornecer equipamentos e acessórios em boas condições de uso para colaboradores que necessitem de equipamento corporativo."}, {"l": "Registrar o número de série de cada equipamento entregue no Termo de Responsabilidade assinado pelo colaborador."}, {"l": "Oferecer suporte técnico por meio do setor de TI para manutenção, instalação de softwares e solução de problemas."}, {"l": "Comunicar previamente ao colaborador qualquer monitoramento ou inspeção dos equipamentos."}, {"l": "Ressarcir o colaborador em caso de danos ao equipamento pessoal comprovadamente causados por orientação incorreta da empresa."}]}, {"h": "7. Devolução de Equipamentos", "b": [{"p": "O colaborador deverá devolver todos os equipamentos e acessórios corporativos ou compartilhados nos seguintes casos:"}, {"l": "Desligamento da empresa (demissão, pedido de demissão ou encerramento de contrato)."}, {"l": "Mudança de função que não exija mais o uso dos equipamentos."}, {"l": "Substituição por novo equipamento."}, {"l": "Solicitação formal do setor de TI ou RH."}, {"p": "A devolução deve incluir todos os itens listados no Termo de Responsabilidade assinado (equipamento principal, carregador, cabos, acessórios e embalagem original, quando disponível). Os itens serão conferidos pelo número de série registrado no momento da entrega."}, {"p": "O equipamento deve ser devolvido:"}, {"l": "Limpo e em condições de uso."}, {"l": "Com dados pessoais do colaborador removidos, se assim preferir."}, {"l": "Dentro do prazo de até 3 (três) dias úteis após a solicitação ou desligamento."}, {"n": "A não devolução de qualquer item listado no Termo ou a devolução com danos além do desgaste normal de uso poderá acarretar descontos em rescisão ou medidas administrativas e legais cabíveis. O número de série registrado é a prova de vínculo entre o equipamento e o colaborador."}]}, {"h": "8. Sanções por Descumprimento", "b": [{"p": "O descumprimento desta política poderá acarretar, conforme a gravidade da infração:"}, {"l": "Advertência formal registrada no prontuário do colaborador."}, {"l": "Suspensão do acesso a recursos de TI."}, {"l": "Descontos em folha de pagamento ou rescisão para cobertura de danos comprovados."}, {"l": "Rescisão por justa causa, nos termos da CLT, em casos de uso indevido grave."}, {"l": "Responsabilização civil e/ou criminal, conforme a legislação vigente (Lei 12.737/2012 – Lei Carolina Dieckmann, LGPD – Lei 13.709/2018)."}]}, {"h": "9. Disposições Finais", "b": [{"p": "Esta política entra em vigor na data de sua assinatura pelo colaborador e substitui eventuais versões anteriores. A Monumenta reserva-se o direito de atualizá-la sempre que necessário, comunicando os colaboradores com antecedência mínima de 15 dias."}, {"p": "Em caso de dúvidas, o colaborador deve contatar o setor de Recursos Humanos ou TI."}]}]};
/* Resumos para leitura rápida; o texto integral continua valendo */
const POL_RESUMO={
 p1:['Respeito, honestidade e cooperação com colegas, clientes e fornecedores.','Assédio e discriminação não são tolerados. Reporte ao RH: o relato é tratado com sigilo e sem retaliação.','Ausências, atrasos e saídas antecipadas são combinados antes com o gestor.','Presentes de clientes e fornecedores, só brindes simbólicos. Conflito de interesses se comunica ao gestor e ao RH.'],

/* ---------- validação de formato (defeito herdado nº 6) ---------- */
const dig=s=>String(s||'').replace(/\D/g,'');
function cpfOk(v){const c=dig(v);if(c.length!==11||/^(\d)\1+$/.test(c))return false;
 let s=0;for(let i=0;i<9;i++)s+=+c[i]*(10-i);let r=s*10%11%10;if(r!==+c[9])return false;
 s=0;for(let i=0;i<10;i++)s+=+c[i]*(11-i);r=s*10%11%10;return r===+c[10]}
function cnpjOk(v){const c=dig(v);if(c.length!==14||/^(\d)\1+$/.test(c))return false;
 const calc=n=>{const w=n===12?[5,4,3,2,9,8,7,6,5,4,3,2]:[6,5,4,3,2,9,8,7,6,5,4,3,2];let s=0;for(let i=0;i<n;i++)s+=+c[i]*w[i];const r=s%11;return r<2?0:11-r};
 return calc(12)===+c[12]&&calc(13)===+c[13]}
function dataOk(v){const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(v||'');if(!m)return false;
 const d=new Date(+m[3],+m[2]-1,+m[1]);return d.getFullYear()===+m[3]&&d.getMonth()===+m[2]-1&&d.getDate()===+m[1]}
const parseData=v=>{const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(v||'');return m?new Date(+m[3],+m[2]-1,+m[1]):null};
const MASK={
 cpf:v=>{const d=dig(v).slice(0,11);return d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2')},
 cnpj:v=>{const d=dig(v).slice(0,14);return d.replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\d{4})(\d)/,'$1-$2')},
 tel:v=>{const d=dig(v).slice(0,11);return d.length<=2?d.replace(/^(\d{1,2})/,'($1'):d.length<=6?d.replace(/^(\d{2})(\d+)/,'($1) $2'):d.length<=10?d.replace(/^(\d{2})(\d{4})(\d+)/,'($1) $2-$3'):d.replace(/^(\d{2})(\d{5})(\d+)/,'($1) $2-$3')},
 cep:v=>{const d=dig(v).slice(0,8);return d.replace(/^(\d{5})(\d)/,'$1-$2')},
 date:v=>{const d=dig(v).slice(0,8);return d.replace(/^(\d{2})(\d)/,'$1/$2').replace(/^(\d{2})\/(\d{2})(\d)/,'$1/$2/$3')},
 pis:v=>{const d=dig(v).slice(0,11);return d.replace(/^(\d{3})(\d)/,'$1.$2').replace(/^(\d{3})\.(\d{5})(\d)/,'$1.$2.$3').replace(/(\d{2})(\d)$/,'$1-$2')}
};
const VALID={
 cpf:v=>cpfOk(v)||'CPF inválido. Confira os números.',
 cnpj:v=>cnpjOk(v)||'CNPJ inválido. Confira os números.',
 date:v=>dataOk(v)||'Use o formato dd/mm/aaaa.',
 tel:v=>dig(v).length>=10||'Inclua o DDD: (21) 90000-0000.',

 const atual=UI.role==='col'&&['etapa','equipe','org','expect','guia','proposta','politicas'].includes(UI.view)?'eu':UI.view;
 return L.map(([k,t,i])=>`<button type="button" ${atual===k?'aria-current="page"':''} onclick="${k==='pessoas'?'irPessoas()':`go('${k}')`}">
  ${k==='hoje'?`<span class="today num" style="width:24px;height:24px" aria-hidden="true">${S.clock.getDate()}</span>`:ic(i,24,1.8)}<span>${t}</span>

const saud=()=>{const h=new Date().getHours();return h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'};

function rowAlerta(a){const r=a.ref,com=r.rh&&r.rh!==EU_RH&&a.resp===r.rh?` · com ${pnome(r.rh)}`:'';
 return `<button type="button" class="prow" onclick="abrir('${r.id}','${stepDe(a)}')">
  ${av(r.nome,a.k)}<span class="pm"><span class="pn">${esc(r.nome)}</span><span class="ps">${esc(a.t)}${esc(com)}</span></span>
  <span class="pw ${kc(a.k)}">${esc(a.w)}</span><span class="chev">${ic('chev',16,2.4)}</span></button>`}
function stepDe(a){return {cobrar:'',conferir:'conf',contrato:'contrato',acessos:'acessos',checklist:a.t.includes('semana')?'s1':'d1',travado:'voz'}[a.grp]||''}
function acaoGrupo(k){const G=porGrupo()[k]||[],ids=G.map(a=>a.ref.id);if(!ids.length)return;
 if(k==='cobrar')cobrarLote(ids);else if(k==='contrato')enviarContratoLote(ids);else if(k==='acessos')cobrarTILote(ids);
 else abrir(ids[0],stepDe(G[0]))}
function vHoje(){

 const PP=pessoas(),cad=PP.filter(p=>p.fase==='Cadastro'),comigo=cad.filter(p=>p.need).length;

 const grupos=GRUPOS.filter(g=>G[g.k]&&G[g.k].length);
 const sinc=n=>new Date(S.clock.getTime()+16*3600000-n*3600000).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
 return `<div class="wrap"><div class="stack-l">
 <header class="stack-s">
  <div class="between"><span class="t-sub" style="font-weight:500">${esc(SEM[S.clock.getDay()].replace(/^./,c=>c.toUpperCase()))}, ${fmtL(S.clock)}</span>
   <button type="button" class="icon-btn mob-only" onclick="go('ajustes')" aria-label="Ajustes">${ic('gear',20,1.8)}</button></div>
  <h1 class="t-title">${saud()}, ${pnome(EU_RH)}.</h1>
  <p class="t-hero" style="margin-top:8px">${need?`${pl(need,'pessoa precisa','pessoas precisam')} de você hoje.<span class="soft"> O resto está andando.</span>`:`Ninguém precisa de você agora.<span class="soft"> Tudo no prazo.</span>`}</p>
 </header>

 ${grupos.length?`<section class="stack" aria-labelledby="s-precisa"><h2 class="t-sec" id="s-precisa">Precisa de você</h2>
  ${grupos.map(g=>{const L=G[g.k],b=typeof g.btn==='function'?g.btn(L.length):g.btn,prim=g.lote||g.k==='travado';
   return `<div class="list" style="padding-bottom:4px"><div class="grp-h"><span class="gt">${g.t}</span>
    <button type="button" class="btn ${prim?'':'sec'}" onclick="acaoGrupo('${g.k}')">${esc(b)}</button></div>
    ${L.map(rowAlerta).join('')}</div>`}).join('')}</section>`:''}

 <section class="stack" aria-labelledby="s-olho">
  <div class="sec-h"><h2 class="t-sec" id="s-olho">De olho</h2>${olho.length>3?`<button type="button" class="lnk" onclick="UI.verTodos=!UI.verTodos;tudo()">${UI.verTodos?'Mostrar menos':`Ver todos (${olho.length})`}</button>`:''}</div>
  ${olho.length?`<div class="list">${(UI.verTodos?olho:olho.slice(0,3)).map(a=>`<button type="button" class="irow" onclick="${a.go||`abrir('${a.ref.id}')`}">
    ${pill(a.k,a.tag)}<span class="it">${esc(pnome(a.ref.nome))} · ${esc(a.sub)}</span><span class="iw">${esc(a.resp)}</span></button>`).join('')}</div>`
   :`<div class="empty">Nada fora do combinado com gestores e colaboradores.</div>`}
 </section>

 <section class="stack" aria-labelledby="s-rel"><h2 class="t-sec" id="s-rel">Num relance</h2>
  <div class="grid3">
   <div class="card stat"><b>${cad.length}</b><span class="sl">em cadastro</span><span class="sd">${comigo} esperando você, ${cad.length-comigo} com a pessoa ou a TI</span></div>
   <div class="card stat"><b>${onb.length}</b><span class="sl">em onboarding</span><span class="sd">${prog}% das etapas feitas, em média</span></div>
   <div class="card stat"><b class="${c.n<PZ('amostra')?'nil':''}">${c.n>=PZ('amostra')?dec(c.v):'—'}</b><span class="sl">dias do convite ao acesso</span>
    <span class="sd">${c.n>=PZ('amostra')?`Média de ${c.n} pessoas`:`${c.n?`Só ${pl(c.n,'pessoa concluiu','pessoas concluíram')}`:'Ninguém concluiu ainda'}. A média aparece a partir de ${PZ('amostra')}.`}</span></div>
  </div>
 </section>

 <footer class="row-h t-note" style="gap:16px">
  <span>Wrike e Protheus atualizados às ${sinc(0)}</span>
  <span class="row-h c-warn" style="gap:6px">${ic('warn',14,2.3)}ZapSign sem resposta desde as ${sinc(14)}</span>
 </footer>
 </div></div>`;
}

function listaFiltrada(){
 const q=UI.q.trim().toLowerCase(),PP=pessoas();
 const base=q?PP.filter(p=>(p.nome+' '+p.ref.cargo+' '+p.ref.area).toLowerCase().includes(q)):PP;
 return {mim:base.filter(p=>p.need),curso:base.filter(p=>!p.fim),fim:base.filter(p=>p.fim),todos:base};
}
function htmlLista(){
 const L=listaFiltrada(),cur=L[UI.seg];
 if(UI.sel==null||!achar(UI.sel)){UI.sel=(cur[0]||L.curso[0]||{}).id||null}
 const segs=[['mim','Precisa de mim'],['curso','Em curso'],['fim','Concluídos']];
 return `<div class="seg" role="group" aria-label="Filtrar pessoas">${segs.map(([k,t])=>`<button type="button" aria-pressed="${UI.seg===k}" onclick="setSeg('${k}')">${t} · <span class="num">${L[k].length}</span></button>`).join('')}</div>
 <div id="lst-rows" class="stack-s" style="gap:2px">${cur.length?cur.map(p=>`<button type="button" class="lrow" aria-current="${UI.sel===p.id}" onclick="selPessoa('${p.id}')">
   ${av(p.nome,p.i.k,'s')}<span class="lm"><span class="l1"><span class="ln">${esc(p.nome)}</span><span class="lw ${kc(p.i.k)}">${esc(p.i.w)}</span></span>
   <span class="ls">${esc(p.ref.estado==="proposta_enviada"?"Proposta":p.ref.tipo==="proc"&&STAGE[p.ref.estado]>=3?"Contrato":p.fase)} · ${esc(p.i.t)}</span></span></button>`).join('')
  :`<div class="empty">${UI.q?`Ninguém com “${esc(UI.q)}”.`:UI.seg==='mim'?'Ninguém esperando você. Bom trabalho.':UI.seg==='fim'?'Ninguém concluiu os 90 dias ainda.':'Nenhuma pessoa em curso.'}</div>`}</div>`;
}
function pintarLista(){const el=$('lst-body');if(el)el.innerHTML=htmlLista();else tudo()}

 if(UI.sel==null||!achar(UI.sel))UI.sel=(L[UI.seg][0]||L.curso[0]||{}).id||null;

   <div id="lst-body" class="stack">${htmlLista()}</div>

const acts=A=>A.length?`<div class="acts">${A.map(a=>a.link?`<button type="button" class="lnk" onclick="${a.go}">${esc(a.t)} ›</button>`
 :`<button type="button" class="btn ${a.sec?'sec':''} ${a.lg===false?'':'lg'}" onclick="${a.go}">${esc(a.t)}</button>`).join('')}</div>`:'';

function quemAcompanha(x){return `<section class="stack" aria-label="Quem acompanha"><h3 class="t-sec">Quem acompanha</h3><div class="grid2">

function historico(x){return `<details class="card pad-s"><summary class="t-body" style="cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center">Histórico · ${pl(x.hist.length,'evento','eventos')}</summary>

function jstep(id,s){const open=UI.open[id]===s.k;
 return `<div class="jstep ${s.cls||''}"><button type="button" aria-expanded="${open}" onclick="toggleStep('${id}','${s.k}')">

  ${open?`<div class="jbody">${s.b||'<p class="t-sub">Sem nada para fazer aqui agora.</p>'}</div>`:''}</div>`}
function toggleStep(id,k){UI.open[id]=UI.open[id]===k?null:k;tudo()}

/* ----- detalhe de cadastro ----- */
const STAGE={proposta_enviada:0,convite_enviado:1,em_preenchimento:1,em_conferencia:2,correcao_solicitada:2,aprovado:3,aguardando_assinatura:3,assinado:4,concluido:5};
function nextProc(p){const n=pnome(p.nome),i=infoProc(p),ver={t:`Ver como ${n} vê`,go:`verComo('${p.id}')`,link:1};
 switch(p.estado){
  case 'proposta_enviada':return desde(p.prop.enviadaEm)>=PZ('prop')
   ?{k:'warn',t:`${n} ainda não respondeu à proposta.`,c:`Enviada ${ha(p.prop.enviadaEm).toLowerCase()}${p.prop.vistaEm?', aberta em '+fmtL(p.prop.vistaEm):', ainda não aberta'}. Vale até ${fmtL(new Date(p.prop.enviadaEm.getTime()+(p.prop.validade||5)*DAY))}.`,a:[{t:'Reenviar proposta',go:`reenviarProposta('${p.id}')`},{t:'Registrar aceite',go:`registrarAceite('${p.id}')`,sec:1},ver]}
   :{k:'wait',e:'Esperando a pessoa',t:`Proposta enviada. Esperando o aceite de ${n}.`,c:`${p.prop.vistaEm?'Já abriu a proposta.':'Ainda não abriu.'} Com o aceite, o cadastro abre sozinho.`,a:[ver]};
  case 'convite_enviado':return desde(p.conviteEm)>=PZ('pre')
   ?{k:'warn',t:`${n} ainda não abriu o convite.`,c:`Enviado ${ha(p.conviteEm).toLowerCase()}. O prazo do cadastro ${dias(p.prazo)<0?'venceu em '+fmtL(p.prazo):'vai até '+fmtL(p.prazo)}.${p.cobrancas?' '+pl(p.cobrancas,'cobrança enviada','cobranças enviadas')+'.':''}`,
     a:[{t:'Cobrar por e-mail e WhatsApp',go:`cobrar('${p.id}')`},...(dias(p.prazo)<0?[{t:'Dar novo prazo',go:`novoPrazo('${p.id}')`,sec:1}]:[]),ver]}
   :{k:'wait',e:'Esperando a pessoa',t:`Convite enviado. Esperando ${n} começar.`,c:`O prazo vai até ${fmtL(p.prazo)}. Se ${n} não abrir em ${PZ('pre')} dias, aparece em Hoje.`,a:[ver]};
  case 'em_preenchimento':return dias(p.prazo)<0
   ?{k:'warn',t:`O prazo de ${n} venceu.`,c:`${docsEnv(p)} de ${p.docs.length} documentos enviados. Venceu em ${fmtL(p.prazo)}.`,a:[{t:'Cobrar por e-mail e WhatsApp',go:`cobrar('${p.id}')`},{t:'Dar novo prazo',go:`novoPrazo('${p.id}')`,sec:1},ver]}
   :{k:i.k,e:'Esperando a pessoa',t:`${n} está preenchendo o cadastro.`,c:`${docsEnv(p)} de ${p.docs.length} documentos enviados. ${vence(p.prazo)}.`,a:[ver]};
  case 'em_conferencia':return {k:i.k,t:`${n} enviou tudo. Falta conferir.`,c:`${docsVal(p)} de ${p.docs.length} documentos validados. Valide cada um ou peça correção.`,a:[{t:'Conferir documentos',go:`toggleStep('${p.id}','conf');document.getElementById('jrn').scrollIntoView({behavior:'smooth'})`},ver]};
  case 'correcao_solicitada':return {k:i.k,e:'Esperando a pessoa',t:`Esperando ${n} reenviar a correção.`,c:`${p.correcaoMotivo} Pedida ${ha(p.correcaoEm).toLowerCase()}.`,
   a:[{t:desde(p.correcaoEm)>PZ('corr')?'Cobrar por e-mail e WhatsApp':`Lembrar ${n}`,go:`cobrar('${p.id}')`,sec:desde(p.correcaoEm)<=PZ('corr')},ver]};
  case 'aprovado':if(!polsOk(p))return {k:'wait',e:'Esperando a pessoa',t:`${n} precisa aceitar as políticas.`,c:`${polsN(p)} de ${POLITICAS.length} aceitas. O contrato sai com as políticas anexadas, então ele só é enviado depois disso.`,a:[{t:'Lembrar a pessoa',go:`cobrar('${p.id}')`},ver]};
   return {k:'prog',t:'Dados e políticas ok. Hora do contrato.',c:`${p.modelo==='PJ'?'Contrato de prestação de serviço (PJ)':'Contrato de trabalho (CLT)'}, assinado pelo ZapSign. ${n} tem ${PZ('ass')} dias para assinar.`,a:[{t:'Enviar contrato pelo ZapSign',go:`enviarContrato('${p.id}')`},ver]};
  case 'aguardando_assinatura':return desde(p.contratoEm)>PZ('ass')
   ?{k:'crit',t:`${n} não assinou o contrato.`,c:`Enviado ${ha(p.contratoEm).toLowerCase()}. O prazo de ${PZ('ass')} dias passou. O início está marcado para ${fmtL(p.inicio)}.`,a:[{t:'Cobrar assinatura',go:`cobrar('${p.id}')`},{t:'Registrar assinatura',go:`marcarAssinado('${p.id}')`,sec:1},ver]}
   :{k:'wait',e:'Esperando a pessoa',t:'Contrato enviado. Esperando a assinatura.',c:`Prazo até ${fmtL(new Date(p.contratoEm.getTime()+PZ('ass')*DAY))}.`,a:[{t:'Registrar assinatura',go:`marcarAssinado('${p.id}')`,sec:1},ver]};
  case 'assinado':{const f=acessosFalta(p),k=p.acessos.ms?'wrike':'ms';
   return {k:i.k,t:`Faltam os acessos: ${juntaE(f)}.`,c:`Contrato assinado ${ha(p.assinadoEm).toLowerCase()}. A TI cria o Microsoft 365 e a Gestão de Projetos, o Wrike.${p.tiCobrada?' Pedido reforçado '+pl(p.tiCobrada,'vez','vezes')+'.':''}`,
    a:[p.wrikeEm?{t:`Marcar ${k==='ms'?'Microsoft 365':'Wrike'} como criado`,go:`criarAcesso('${p.id}','${k}')`}:{t:'Criar tarefa no Wrike',go:`tarefaWrike('${p.id}')`},p.wrikeEm?{t:'Ver a tarefa de novo',go:`tarefaWrike('${p.id}')`,sec:1}:{t:`Marcar ${k==='ms'?'Microsoft 365':'Wrike'} como criado`,go:`criarAcesso('${p.id}','${k}')`,sec:1}]}}
 }
 return {k:'ok',t:'Cadastro concluído.',a:[]};
}
function detProc(p){
 const st=STAGE[p.estado],i=infoProc(p);
 const S2=(n,b)=>n<st?'ok':n===st?b:'lock';
 const docRow=(d,j)=>`<div class="mini"><span class="mt">${esc(d.n)}${d.arq?`<small>${esc(d.arq)}</small>`:d.motivo?`<small class="c-crit">${esc(d.motivo)}</small>`:''}</span>
   ${d.st==='validado'?pill('ok','Validado'):d.st==='enviado'?pill('prog','Para conferir'):d.st==='recusado'?pill('crit','Recusado'):pill('lock','Não enviado')}
   ${d.st==='enviado'&&p.estado==='em_conferencia'?`<button type="button" class="btn sm" onclick="validarDoc('${p.id}',${j})">Validar</button><button type="button" class="btn sm sec" onclick="recusarDoc('${p.id}',${j})">Recusar</button>`:''}${(d.st==='pendente'||d.st==='recusado')&&p.estado==='em_conferencia'?`<button type="button" class="btn sm sec" onclick="receberDoc('${p.id}',${j})">Recebi</button>`:''}</div>`;
 const steps=[
  stepProposta(p),
  {k:'convite',t:'Cadastro liberado',st:st>=1?'ok':'lock',w:st>=1?fmtL(p.conviteEm):'Com o aceite',b:`<p class="t-sub">Portal individual: <span class="mono">monutrack.app/entrada/${p.id.toLowerCase()}</span></p><p class="t-note">No protótipo: abra este endereço terminado em <span class="mono">#${tokenDe(p)}</span> em outra aba.</p>${p.cobrancas?`<p class="t-sub">${pl(p.cobrancas,'cobrança enviada','cobranças enviadas')}.</p>`:''}`},
  {k:'dados',t:'Dados e documentos',st:S2(1,i.k),w:st>1?'Enviados '+fmtc(p.enviadoEm):st===1?i.w:'',
   b:`<p class="t-sub">${p.estado==='convite_enviado'?`${pnome(p.nome)} ainda não começou. Prazo: ${fmtL(p.prazo)}.`:`${docsEnv(p)} de ${p.docs.length} documentos enviados${p.enviadoEm?' em '+fmtL(p.enviadoEm):''}. Modelo ${p.modelo}, definido pelo RH.`}</p>${p.modelo==='PJ'&&p.form&&p.form.regime?`<p class="t-sub">Regime de tributação: <b style="font-weight:600;color:var(--ink)">${esc(p.form.regime)}${p.form.regime==='Simples Nacional'&&p.form.anexo?' · '+esc(p.form.anexo):''}</b></p>`:''}`},
  {k:'conf',t:'Conferência do RH',st:S2(2,i.k),w:st>2?'Validado '+fmtc(p.validadoEm):st===2?i.w:'',
   b:`${p.estado==='correcao_solicitada'?`<p class="notice c-warn">${ic('warn',16,2.3)}<span>Correção pedida: ${esc(p.correcaoMotivo)}</span></p>`:''}
    <div>${p.docs.map(docRow).join('')}</div>
    ${p.estado==='em_conferencia'?`<div class="acts row-h">
     ${p.docs.some(d=>d.st==='pendente'||d.st==='recusado')?`<button type="button" class="btn sec" onclick="receberTodos('${p.id}')">Marcar todos como recebidos</button>`:''}${p.docs.some(d=>d.st==='enviado')?`<button type="button" class="btn sec" onclick="validarTodos('${p.id}')">Validar todos</button>`:''}
     <button type="button" class="btn" ${docsPend(p)?'disabled aria-describedby="ap-h"':''} onclick="aprovarCadastro('${p.id}')">Aprovar cadastro</button>
     <button type="button" class="btn sec" onclick="solicitarCorrecao('${p.id}')">Pedir correção</button></div>
     ${docsPend(p)?`<p class="t-note" id="ap-h">Aprovar fica disponível quando os ${p.docs.length} documentos estiverem validados.</p>`:''}`:''}`},
  stepPoliticas(p,st),
  {k:'contrato',t:'Contrato',st:S2(3,i.k),w:st>3?'Assinado '+fmtc(p.assinadoEm):st===3?i.w:'',
   b:`<dl class="kv"><dt>Tipo</dt><dd>${esc(tipoContrato(p))}</dd><dt>Assinatura</dt><dd>ZapSign</dd>
    <dt>Enviado</dt><dd>${p.contratoEm?fmtL(p.contratoEm):'Ainda não'}</dd><dt>Prazo</dt><dd>${p.contratoEm?fmtL(new Date(p.contratoEm.getTime()+PZ('ass')*DAY)):`${PZ('ass')} dias após o envio`}</dd>
    <dt>Assinado</dt><dd>${p.assinadoEm?fmtL(p.assinadoEm):'Ainda não'}</dd></dl>

    ${st<3?'<p class="t-note">O contrato só pode ser emitido depois que a documentação for aprovada.</p>':''}`},

     ${p.acessos[k]?pill('ok','Criado'):p.assinadoEm?pill(i.k==='crit'?'crit':'prog','Pendente'):pill('lock','Depois da assinatura')}

    ${p.assinadoEm&&acessosFalta(p).length?`<div class="row-h" style="gap:8px"><button type="button" class="btn sm ${p.wrikeEm?'sec':''}" onclick="tarefaWrike('${p.id}')">${p.wrikeEm?'Tarefa no Wrike criada em '+fmtc(p.wrikeEm):'Criar tarefa no Wrike'}</button></div>`:''}`},
  {k:'dia1',t:'Primeiro dia',st:'lock',w:fmtL(p.inicio),b:`<p class="t-sub">${fmtW(p.inicio).replace(/^./,c=>c.toUpperCase())}. O onboarding é criado sozinho quando os acessos ficam prontos.</p>`},

 if(UI.open[p.id]===undefined)UI.open[p.id]=steps.find(s=>s.st!=='ok'&&s.st!=='lock')?.k||null;
 const linha=`${cargoTxt(p.cargo)} · ${areaCli(p)} · ${p.modelo} · começa em ${fmtL(p.inicio)}`;
 return `${cabeca(p,linha)}<div class="stack-l" style="gap:32px">${cardNext(nextProc(p))}${conversaRH(p)}

/* ----- detalhe de onboarding ----- */
function nextOnb(o){const n=pnome(o.nome),ver={t:`Ver como ${n} vê`,go:`verComo('${o.id}')`,link:1};
 if(o.fase==='jornada')return {k:'ok',e:'Na Jornada',t:`${n} concluiu os 90 dias.`,c:'Daqui em diante: benefícios, conformidade e evolução de perfil.',a:[ver]};
 if(travado(o)){const u=ultimoPulso(o);return {k:'crit',t:`${n} disse que está travado.`,q:u.txt||'',c:`Respondeu ao pulso ${ha(u.d).toLowerCase()}. ${o.gestor} também foi avisado.`,
  a:[{t:'Combinar conversa',go:`combinarConversa('${o.id}')`},{t:'Já conversamos',go:`marcarTratado('${o.id}')`,sec:1},ver]}}
 for(const k of ['d30','d60','d90']){const f=o.fb[k],dd=dias(marco(o,k)),m=k.slice(1);
  if(f.st==='ajuste')return {k:'crit',t:`Plano de ajuste aberto na conversa de ${m} dias.`,c:`${f.plano} Acompanhamento até ${fmtL(f.prazo)}.`,a:[{t:'Marcar plano como resolvido',go:`resolverFB('${o.id}','${k}')`},ver]};
  if(f.st!=='ok'&&dd<=5)return {k:dd<0?'warn':'prog',t:`Conversa de ${m} dias ${dd<0?'atrasada':'chegando'}.`,c:`Com ${o.gestor}, ${dd<0?'estava prevista para':'prevista para'} ${fmtL(marco(o,k))}.`,
   a:[{t:'Registrar conversa',go:`registrarFB('${o.id}','${k}','ok')`},{t:'Registrar com plano de ajuste',go:`registrarFB('${o.id}','${k}','ajuste')`,sec:1}]};
 }
 const age=desde(o.inicio),d1p=o.d1.filter(x=>!x.ok).length,s1p=o.s1.filter(x=>!x.ok).length;
 if(d1p)return {k:age>=1?'warn':'prog',t:`Faltam ${pl(d1p,'item','itens')} do primeiro dia.`,c:'Quem marca é o RH, junto com a pessoa.',a:[{t:'Abrir checklist',go:`toggleStep('${o.id}','d1')`},ver]};
 if(s1p&&age>=1)return {k:age>=PZ('sem')?'warn':'prog',t:`Faltam ${pl(s1p,'item','itens')} da primeira semana.`,c:`O prazo é o ${PZ('sem')}º dia.`,a:[{t:'Abrir checklist',go:`toggleStep('${o.id}','s1')`},ver]};
 if(['d30','d60','d90'].every(k=>o.fb[k].st==='ok'))return {k:'prog',t:'Ciclo de 90 dias completo.',c:`Concluir leva ${n} para a Jornada.`,a:[{t:'Concluir onboarding',go:`concluirOnb('${o.id}')`},ver]};
 const prox=['d30','d60','d90'].find(k=>o.fb[k].st!=='ok');
 return {k:'ok',e:'Tudo em dia',t:`${n} está em dia.`,c:`Próxima conversa: ${prox.slice(1)} dias, em ${fmtL(marco(o,prox))}, com ${o.gestor}.`,a:[ver]};
}
function detOnb(o){
 const age=desde(o.inicio),p=o.procId?S.proc.find(x=>x.id===o.procId):null;
 const vidsOk=VIDEOS.filter(v=>v.ob).every(v=>o.videos[v.id])&&vaOk(o),polsOk=POLITICAS.every(x=>o.pols[x.id]);
 const chk=g=>`<div>${o[g].map((x,j)=>`<button type="button" class="tick ${x.ok?'on':''}" role="checkbox" aria-checked="${x.ok}" onclick="toggleChk('${o.id}','${g}',${j})"><span class="box">${x.ok?ic('check',14,3):''}</span><span>${esc(x.t)}</span></button>`).join('')}</div>`;
 const fbStep=k=>{const f=o.fb[k],dd=dias(marco(o,k)),m=k.slice(1);
  const s=f.st==='ok'?'ok':f.st==='ajuste'?'crit':dd<0?'warn':dd<=5?'prog':'lock';
  return {k,t:`Conversa de ${m} dias`,st:s,w:f.st==='ok'?fmtc(f.data):f.st==='ajuste'?'Plano até '+fmtc(f.prazo):dd<0?atraso(-dd):fmtL(marco(o,k)),
   b:`<p class="t-sub">Com ${esc(o.gestor)}, ${f.st==='ok'?'feita em '+fmtL(f.data):'prevista para '+fmtL(marco(o,k))}.</p>
    ${f.notas?`<p class="quote">${esc(f.notas)}</p>`:''}${f.plano?`<p class="notice c-crit">${ic('target',16,2.2)}<span>Plano: ${esc(f.plano)}</span></p>`:''}
    ${f.st==='nao'||f.st==='pendente'?`<div class="row-h"><button type="button" class="btn" onclick="registrarFB('${o.id}','${k}','ok')">Registrar conversa</button><button type="button" class="btn sec" onclick="registrarFB('${o.id}','${k}','ajuste')">Com plano de ajuste</button></div>`:''}
    ${f.st==='ajuste'?`<div><button type="button" class="btn" onclick="resolverFB('${o.id}','${k}')">Marcar plano como resolvido</button></div>`:''}`}};
 const allFb=['d30','d60','d90'].every(k=>o.fb[k].st==='ok');
 const d1ok=o.d1.every(x=>x.ok)&&o.chamada,s1ok=o.s1.every(x=>x.ok);
 const steps=[
  {k:'cad',t:'Cadastro',st:'ok',w:p&&p.acessosEm?fmtL(p.acessosEm):'Concluído',b:`<p class="t-sub">${p?`Convite em ${fmtL(p.conviteEm)}, acessos prontos em ${fmtL(p.acessosEm)}.`:'Concluído antes deste ciclo do MonuTrack.'}</p>`},
  {k:'d1',t:'Primeiro dia',st:d1ok?'ok':age>=1?'warn':'prog',w:d1ok?fmtc(o.inicio):`${o.d1.filter(x=>x.ok).length} de ${o.d1.length}`,
   b:`${chk('d1')}<p class="t-note">${o.chamada?'Presença confirmada na chamada de boas-vindas.':'Ainda não confirmou presença na chamada de boas-vindas (é a pessoa quem confirma, no portal).'}</p>`},
  {k:'s1',t:'Primeira semana',st:s1ok?'ok':age>=PZ('sem')?'warn':'prog',w:s1ok?'Completa':`${o.s1.filter(x=>x.ok).length} de ${o.s1.length}`,b:chk('s1')},
  {k:'cont',t:'Vídeos e políticas',st:vidsOk&&polsOk?'ok':age>=PZ('pol')&&!polsOk?'warn':'prog',w:`${VIDEOS.filter(v=>o.videos[v.id]).length+POLITICAS.filter(x=>o.pols[x.id]).length} de ${VIDEOS.length+POLITICAS.length}`,
   b:`<div><div class="mini"><span class="mt">Boas-vindas da área ${esc(o.area)}<small>${temVA(o)?'Vídeo de '+esc(vidArea(o.area).quem)+' · obrigatório':'A área ainda não gravou'}</small></span>${!temVA(o)?pill('lock','Não gravado'):o.videoArea?pill('ok','Assistiu'):pill('wait','Ainda não')}</div>${VIDEOS.map(v=>`<div class="mini"><span class="mt">${esc(v.t)}<small>Vídeo · ${v.dur}${v.ob?' · obrigatório':''}</small></span>${o.videos[v.id]?pill('ok','Assistiu'):pill(v.ob?'wait':'lock',v.ob?'Ainda não':'Opcional')}</div>`).join('')}
    ${POLITICAS.map(x=>`<div class="mini"><span class="mt">${esc(x.t)}<small>${x.aceite?'Aceite formal · v'+x.v:'Leitura'}</small></span>${o.pols[x.id]?pill('ok','Aceitou'):pill('wait','Ainda não')}</div>`).join('')}</div>
    <p class="t-note">Quem marca é a pessoa, no portal dela. O RH acompanha.</p>`},
  fbStep('d30'),fbStep('d60'),fbStep('d90'),
  {k:'jor',t:'Jornada',st:o.fase==='jornada'?'ok':allFb?'prog':'lock',w:o.fase==='jornada'?'Entrou':'',
   b:allFb&&o.fase!=='jornada'?`<div><button type="button" class="btn" onclick="concluirOnb('${o.id}')">Concluir onboarding</button></div>`:`<p class="t-sub">${o.fase==='jornada'?'Benefícios, conformidade e evolução de perfil.':'Abre depois da conversa de 90 dias.'}</p>`}];
 if(UI.open[o.id]===undefined)UI.open[o.id]=steps.find(s=>s.st!=='ok'&&s.st!=='lock')?.k||null;
 const L={bem:['ok','Está indo bem'],ok:['wait','Mais ou menos'],dificil:['crit','Estou travado']};
 const linha=`${cargoTxt(o.cargo)} · ${areaCli(o)} · ${o.modelo} · dia ${age+1}`;
 return `${cabeca(o,linha)}<div class="stack-l" style="gap:32px">${perfilRH(o)}${cardNext(nextOnb(o))}${conversaRH(o)}
  <section class="stack" aria-labelledby="jrn-h" id="jrn"><div class="sec-h"><h3 class="t-sec" id="jrn-h">Jornada</h3><span class="t-sub num">${progressoOnb(o)}% feito · nível ${nivel(xp(o)).n} na trilha</span></div>
   <div class="jrn">${steps.map(s=>jstep(o.id,s)).join('')}</div></section>
  <section class="stack" aria-labelledby="voz-h" id="voz"><h3 class="t-sec" id="voz-h">Como está sendo</h3>
   ${o.pulsos.length?`<div class="list">${o.pulsos.slice().reverse().map(u=>`<div class="stack-s" style="padding:14px 0"><div class="between">${pill(L[u.n][0],L[u.n][1])}<span class="t-note">${fmtL(u.d)} · dia ${desde(o.inicio)-desde(u.d)+1}</span></div>
     ${u.txt?`<p class="t-body">“${esc(u.txt)}”</p>`:'<p class="t-sub">Sem comentário.</p>'}</div>`).join('')}</div>`
    :`<div class="empty">${age<2?'A pergunta aparece para a pessoa a partir do terceiro dia.':'Ainda sem resposta.'}</div>`}
  </section>
  ${expectRH(o)}${quemAcompanha(o)}${historico(o)}
  <p class="t-note">Onboarding <span class="mono">${o.id}</span>${p?` · cadastro <span class="mono">${p.id}</span>`:''}</p></div>`;
}

function refDe(me){const E=equipeDe(me);if(!E)return me.gestor;const gk=nk(me.gestor||''),lid=new Set(Object.keys(typeof LIDERES!=='undefined'?LIDERES:{}).map(nk));

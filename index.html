POL_TXT.p5=[{"h": "1. Objetivo", "b": [{"p": "Estabelecer critérios claros e transparentes para o reconhecimento e a premiação de colaboradores da Monumenta que se destacam por desempenho, resultados, comportamento alinhado aos valores da empresa ou contribuições relevantes para os projetos e clientes atendidos."}]}, {"h": "2. Abrangência", "b": [{"p": "Aplica-se a todos os colaboradores da Monumenta (CLT e PJ) elegíveis conforme os critérios definidos em cada modalidade de premiação, podendo haver programas específicos para equipes alocadas em determinados clientes/projetos (ex.: BB Promo, Petrobras, Sebrae, FUNCEF, APEX, Transpetro)."}]}, {"h": "3. Princípios Gerais", "b": [{"p": "3.1. O reconhecimento deve ser justo, transparente e baseado em critérios objetivos e previamente comunicados, evitando favorecimentos pessoais."}, {"p": "3.2. A premiação não substitui nem se confunde com verbas salariais obrigatórias, benefícios previstos em contrato ou em convenção/acordo coletivo, tendo caráter eventual e não incorporável à remuneração, salvo disposição legal em contrário."}]}, {"h": "4. Modalidades de Reconhecimento", "b": [{"p": "4.1. Reconhecimento por desempenho individual: destinado a colaboradores que atingem ou superam metas e indicadores definidos para sua função, projeto ou área."}, {"p": "4.2. Reconhecimento por desempenho de equipe: destinado a equipes ou times de projeto que entregam resultados de destaque em eventos, ativações ou campanhas para clientes."}, {"p": "4.3. Reconhecimento por valores e cultura: destinado a colaboradores que exemplificam os valores da Monumenta (colaboração, excelência no atendimento, inovação, comprometimento), podendo incluir votações internas ou indicações de pares e lideranças."}, {"p": "4.4. Reconhecimento por tempo de casa: marcos de tempo de contribuição à empresa (ex.: 1, 3, 5, 10 anos), reconhecidos por meio de comunicação institucional e/ou brinde simbólico."}, {"p": "4.5. Outras modalidades específicas poderão ser criadas para projetos/clientes específicos, mediante aprovação da Diretoria, com regulamento próprio que complementa esta política."}]}, {"h": "5. Critérios de Elegibilidade", "b": [{"p": "5.1. Estar em efetivo exercício na Monumenta durante todo o período avaliado, salvo exceções aprovadas pela Diretoria/RH."}, {"p": "5.2. Não ter sido alvo de medida disciplinar (advertência ou suspensão) registrada durante o período avaliado."}, {"p": "5.3. Atender aos critérios específicos de cada modalidade de premiação, conforme divulgado no respectivo regulamento ou comunicado interno."}]}, {"h": "6. Tipos de Prêmio", "b": [{"p": "6.1. Os prêmios poderão ser concedidos, entre outras formas, como: certificado/menção honrosa, brindes institucionais, vale-presente, day off (folga remunerada), viagens, bonificação em dinheiro ou benefícios adicionais, conforme definido pela Diretoria para cada programa de reconhecimento."}, {"p": "6.2. Prêmios em dinheiro concedidos de forma eventual seguirão o tratamento tributário e trabalhista aplicável, conforme orientação do Financeiro e do RH, podendo estar sujeitos a retenções previstas em lei."}]}, {"h": "7. Processo de Indicação, Avaliação e Aprovação", "b": [{"p": "7.1. A indicação de colaboradores ou equipes para reconhecimento poderá partir de gestores diretos, de pares (quando aplicável) ou de avaliação automática de indicadores de desempenho, conforme a modalidade."}, {"p": "7.2. As indicações serão avaliadas por um comitê composto por representantes do RH e das lideranças envolvidas, podendo contar com validação da Diretoria para premiações de maior valor ou impacto."}, {"p": "7.3. O resultado da premiação será comunicado aos colaboradores de forma transparente, respeitando a privacidade de informações sensíveis (como avaliações individuais de desempenho)."}]}, {"h": "8. Periodicidade", "b": [{"p": "8.1. As premiações poderão ter periodicidade mensal, trimestral, semestral, anual ou vinculada ao encerramento de um projeto/evento específico, conforme definido para cada modalidade."}, {"p": "8.2. O calendário de premiações vigente será divulgado pelo RH e poderá ser atualizado conforme necessidades operacionais da empresa."}]}, {"h": "9. Vedações", "b": [{"p": "9.1. É vedada a manipulação de indicadores, resultados ou processos de indicação com o objetivo de obter premiação indevida, sujeitando o colaborador envolvido às medidas disciplinares previstas na Política de RH e Conduta."}, {"p": "9.2. Gestores não devem utilizar critérios pessoais, de amizade ou de favorecimento na indicação de colaboradores para premiação."}]}, {"h": "10. Disposições Finais", "b": [{"p": "Esta política poderá ser complementada por regulamentos específicos para cada programa de reconhecimento, aprovados pela Diretoria, e será revisada periodicamente pelo RH. Casos omissos serão decididos pelo RH em conjunto com a Diretoria."}]}];
POL_RESUMO.p5=['Reconhece desempenho individual, de equipe, valores e cultura, e tempo de casa (1, 3, 5 e 10 anos).','Vale para CLT e PJ. É preciso estar em exercício no período e sem advertência ou suspensão.','O prêmio pode ser certificado, brinde, vale-presente, day off, viagem ou bonificação, e não se incorpora à remuneração.','Indicação pelo gestor, por colegas ou por indicadores; um comitê do RH e das lideranças avalia.'];

 m3:{fonte:'rascunho',resumo:['E-mail e arquivos ficam no Microsoft 365, com a sua conta da Monumenta.','Demandas e horas ficam no Wrike.','Problema com equipamento ou acesso: chamado para a TI pelo Milvus.','Dúvida da conta ou de prioridade: seu gestor.'],

 m5:{fonte:'oficial',resumo:['O descanso vale para o prestador de serviço que o acordou no ato da contratação.','São 30 dias por ciclo, que podem ser divididos em até três períodos: 30, 15+15, 20+10 ou 10+10+10.','O descanso não começa logo depois de um feriado nem termina logo antes de feriado ou fim de semana: respeite 2 dias de distância.','A empresa define o período e avisa com pelo menos 30 dias de antecedência. Você pode pedir suas datas preferidas, com aprovação do gestor.'],

 if(o){st.proposta=st.aceite=st.cadastro=st.contrato='done';
  st.politicas=polsOk(o)?'done':'now';

 }else{const s=STAGE[p.estado];

  st.onboarding='lock';st.conversas='lock'}
 const sub={proposta:()=>p&&p.estado==='proposta_enviada'?(p.prop.vistaEm?'Você abriu a proposta':'Proposta enviada '+ha(p.prop.enviadaEm).toLowerCase()):'Recebida',
  aceite:()=>p&&p.prop.aceitaEm?'Aceita em '+fmtL(p.prop.aceitaEm):st.aceite==='now'?'Falta o seu aceite':'Depois da proposta',
  cadastro:()=>{if(!p||st.cadastro==='done')return 'Aprovado';const i=infoProc(p);return st.cadastro==='lock'?'Abre com o aceite':i.t},
  contrato:()=>st.contrato==='done'?'Assinado':st.contrato==='now'?(p.estado==='aguardando_assinatura'?'Esperando a sua assinatura':'O RH está preparando'):'Depois das políticas',

 if(d>0){const E={};
  (s.groups||[]).forEach(g=>g.f.forEach(f=>{if(f.so&&(p.form[f.so[0]]||'')!==f.so[1])return;const v=(p.form[f.k]||'').trim();

  if(s.termos&&!p.form.aceite)E._aceite='Confirme a declaração para enviar.';

function onFormInput(e){const el=e.target;if(!el.dataset||!el.dataset.k||UI.role!=='col')return;const p=euProc();if(!p)return;
 const t=el.dataset.t;let v=el.value;if(t&&MASK[t]&&el.tagName==='INPUT'){const m=MASK[t](v);if(m!==v){el.value=m;v=m}}
 p.form[el.dataset.k]=v;if(UI.err[el.dataset.k]){delete UI.err[el.dataset.k];el.removeAttribute('aria-invalid');const fl=el.closest('.fld');if(fl){fl.classList.remove('bad');const er=fl.querySelector('.err');if(er)er.remove()}}
 salvo();if(el.dataset.k==='regime'){tudo();const r=$('f-regime');if(r)r.focus()}if(t==='cep'&&dig(v).length===8&&p._cep!==dig(v)){p._cep=dig(v);buscarCEP(p,dig(v))}}
async function buscarCEP(p,cep){UI.cepMsg='Buscando o endereço…';const h=document.querySelector('.fgroup [data-k="cep"]');
 try{const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),4000);
  const r=await fetch(`https://viacep.com.br/ws/${cep}/json/`,{signal:ctl.signal});clearTimeout(tm);const j=await r.json();
  if(j.erro)throw new Error('cep');
  Object.assign(p.form,{rua:j.logradouro||p.form.rua||'',bairro:j.bairro||p.form.bairro||'',cidade:j.localidade||p.form.cidade||'',uf:j.uf||p.form.uf||''});
  UI.cepMsg=`Endereço encontrado: ${[j.logradouro,j.bairro,j.localidade].filter(Boolean).join(', ')}. Falta o número.`;salvo();tudo();const n=$('f-numero');if(n)n.focus();
 }catch(err){UI.cepMsg='Não deu para buscar o CEP agora. Preencha o endereço abaixo.';tudo();const n=$('f-rua');if(n&&!n.value)n.focus()}}

function syncAgendar(){if(!SYNC.on||SYNC.ok===false)return;clearTimeout(SYNC.t);SYNC.pend=true;SYNC.t=setTimeout(()=>{SYNC.pend=false;syncSalvar()},1200)}
const _enviarS=enviar;enviar=function(){_enviarS();if(!aplicando&&pacote()!==SYNC.ultimoRemoto)syncAgendar()};
function syncAplicar(row){if(!row||!row.dados)return false;let d;try{d=JSON.parse(row.dados)}catch(e){return false}if(d.ver!==VERSAO_DADOS)return false;
 SYNC.ultimoRemoto=row.dados;SYNC.remotoEm=row.atualizado_em;aplicar(row.dados);S.clock=new Date();nuvAplicar();if(!editando())repintar();
 try{if(CANAL)CANAL.postMessage({t:'state',j:pacote()})}catch(e){}return true}
async function syncIniciar(){if(!SYNC.on)return;
 try{const row=await syncBaixar();SYNC.ok=true;
  if(row&&syncAplicar(row)){/* dados de todos */}else{S.clock=new Date();await syncSalvar()}
  setInterval(syncChecar,8000)}
 catch(e){SYNC.ok=false;console.error(e);toast('Os dados compartilhados não carregaram. Esta tela está usando dados de exemplo só seus.')}}
async function syncChecar(){if(SYNC.ocupado||SYNC.pend)return;
 try{const row=await syncBaixar(true);if(!row||row.atualizado_em===SYNC.remotoEm||row.atualizado_em===SYNC.salvoEm)return;
  const full=await syncBaixar();if(full&&full.dados!==pacote())syncAplicar(full);else if(full)SYNC.remotoEm=full.atualizado_em}catch(e){}}
/* Modo teste: mostra de onde vêm os dados e avisa que reiniciar vale para todos */
const _abTS=abrirTeste;abrirTeste=function(){_abTS();const b=document.querySelector('#layer .sheet-b');if(!b||!SYNC.on)return;
 b.insertAdjacentHTML('afterbegin',`<div class="card pad-s stack-s"><b style="font-weight:600">${SYNC.ok?'Dados compartilhados':'Dados só desta tela'}</b><span class="t-note">${SYNC.ok?`Tudo o que alguém faz aqui aparece para quem abre o link, em até 10 segundos.${SYNC.salvoEm?' Último salvamento: '+new Date(SYNC.salvoEm).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'.':''} "Reiniciar o protótipo" apaga o que todos fizeram.`:'A nuvem não respondeu. O que você fizer aqui não aparece para os outros.'}</span></div>`)};
const _reinS=reiniciar;reiniciar=function(){if(SYNC.on&&SYNC.ok&&!confirmarReinicio())return;_reinS();if(SYNC.on){S.clock=new Date();nuvAplicar();syncSalvar()}};
function confirmarReinicio(){return window.confirm('Reiniciar apaga o que todo mundo fez no link compartilhado e volta aos dados de exemplo. Continuar?')}
syncIniciar();
</script>
